<!-- Paste this before </body> on EACH blog-2026-xx-xx.html page -->
<div id="blog-admin">
  <button id="admin-open" type="button">EDIT BLOG</button>

  <div id="admin-box" style="display:none;">
    <input id="admin-code" type="password" placeholder="Code" />

    <input id="edit-title" type="text" placeholder="Title" />
    <textarea id="edit-body" rows="12" placeholder="Blog body"></textarea>

    <button id="save-blog" type="button">SAVE TO GITHUB</button>
    <div id="save-status"></div>
  </div>
</div>

<style>
  #blog-admin {
    position: fixed;
    right: 18px;
    bottom: 18px;
    z-index: 9999;
    font-family: 'JetBrains Mono', monospace;
  }

  #blog-admin button,
  #blog-admin input,
  #blog-admin textarea {
    width: 100%;
    background: rgba(20, 8, 35, 0.96);
    border: 1px solid #c9a7ff;
    color: #eadcff;
    padding: 0.6rem;
    font-family: inherit;
    margin-bottom: 0.55rem;
  }

  #admin-open {
    width: auto;
    cursor: pointer;
  }

  #admin-box {
    width: 320px;
    background: rgba(10, 3, 20, 0.97);
    border: 1px solid #c9a7ff;
    padding: 1rem;
    box-shadow: 0 0 25px rgba(201, 167, 255, 0.25);
  }

  #edit-body {
    resize: vertical;
  }

  #save-status {
    font-size: 0.75rem;
    color: #d9c2ff;
    min-height: 1rem;
  }
</style>

<script>
  const adminBox = document.getElementById("admin-box");
  const statusBox = document.getElementById("save-status");

  document.getElementById("admin-open").addEventListener("click", () => {
    adminBox.style.display = adminBox.style.display === "none" ? "block" : "none";

    document.getElementById("edit-title").value =
      document.querySelector("h1").textContent.trim();

    document.getElementById("edit-body").value =
      document.getElementById("terminal-text").textContent.trim();
  });

  document.getElementById("save-blog").addEventListener("click", async () => {
    const code = document.getElementById("admin-code").value;
    const title = document.getElementById("edit-title").value.trim();
    const body = document.getElementById("edit-body").value.trim();
    const file = window.location.pathname.split("/").pop();

    statusBox.textContent = "Saving to GitHub...";

    try {
      const res = await fetch("/api/update-blog", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ code, file, title, body })
      });

      const data = await res.json();

      if (!res.ok) {
        statusBox.textContent = data.error || "Save failed.";
        return;
      }

      document.querySelector("h1").textContent = title;
      document.getElementById("terminal-text").textContent = body;

      statusBox.textContent = "Saved. Netlify will redeploy shortly.";
    } catch (err) {
      statusBox.textContent = "Network error.";
    }
  });
</script>
