<!-- Paste this before </body> on EACH blog-2026-xx-xx.html page -->
<div id="blog-admin">
  <input id="admin-code" type="password" placeholder="·" maxlength="12" autocomplete="off" aria-label="admin code" />
  <div id="admin-box" hidden>
    <input id="edit-title" placeholder="Title" />
    <textarea id="edit-body" rows="10" placeholder="Blog body"></textarea>
    <button id="save-blog" type="button">SAVE</button>
    <div id="save-status"></div>
  </div>
</div>

<style>
  #blog-admin {
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 9999;
    font-family: 'JetBrains Mono', monospace;
  }
  #admin-code {
    width: 56px;
    background: rgba(20, 8, 35, 0.35);
    border: 1px solid rgba(201, 167, 255, 0.25);
    color: #eadcff;
    padding: 0.25rem 0.4rem;
    font-family: inherit;
    font-size: 0.75rem;
    text-align: center;
    opacity: 0.3;
    transition: opacity 0.2s, border-color 0.2s;
  }
  #admin-code:hover, #admin-code:focus {
    opacity: 1;
    border-color: #c9a7ff;
    outline: none;
  }
  #admin-box {
    margin-top: 0.5rem;
    width: 300px;
    background: rgba(10, 3, 20, 0.97);
    border: 1px solid #c9a7ff;
    padding: 0.85rem;
    box-shadow: 0 0 25px rgba(201, 167, 255, 0.25);
  }
  #admin-box input,
  #admin-box textarea,
  #admin-box button {
    width: 100%;
    background: rgba(20, 8, 35, 0.96);
    border: 1px solid #c9a7ff;
    color: #eadcff;
    padding: 0.55rem;
    font-family: inherit;
    font-size: 0.85rem;
    margin-bottom: 0.5rem;
    box-sizing: border-box;
  }
  #admin-box textarea { resize: vertical; }
  #admin-box button { cursor: pointer; }
  #save-status {
    font-size: 0.7rem;
    color: #d9c2ff;
    min-height: 0.9rem;
  }
</style>

<script>
  (function () {
    const codeInput = document.getElementById("admin-code");
    const box = document.getElementById("admin-box");
    const statusBox = document.getElementById("save-status");
    let unlockedCode = "";

    codeInput.addEventListener("input", () => {
      if (codeInput.value === "2008") {
        unlockedCode = codeInput.value;
        box.hidden = false;
        codeInput.style.display = "none";
        document.getElementById("edit-title").value =
          document.querySelector("h1").textContent.trim();
        document.getElementById("edit-body").value =
          document.getElementById("terminal-text").textContent.trim();
      }
    });

    document.getElementById("save-blog").addEventListener("click", async () => {
      const title = document.getElementById("edit-title").value.trim();
      const body = document.getElementById("edit-body").value.trim();
      let file = window.location.pathname.split("/").pop() || "";
      if (file && !file.endsWith(".html")) file += ".html";

      statusBox.textContent = "Saving...";

      try {
        const res = await fetch("/api/update-blog", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ code: unlockedCode, file, title, body })
        });
        const data = await res.json();
        if (res.ok) {
          statusBox.textContent = "Saved. Reload soon.";
          document.querySelector("h1").textContent = title;
          document.getElementById("terminal-text").textContent = body;
        } else {
          statusBox.textContent = data.error || "Save failed.";
        }
      } catch (err) {
        statusBox.textContent = "Network error.";
      }
    });
  })();
</script>
