<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>prayashthapa.org</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main id="boot" class="boot-screen" aria-label="Intro video">
    <video id="landingVideo" class="landing-video" autoplay muted loop playsinline preload="auto">
      <source src="assets/video/landing.mp4" type="video/mp4" />
    </video>
    <button id="enterBtn" class="enter-button" type="button">enter</button>
  </main>

  <section id="desktop" class="desktop-screen hidden" aria-label="Windows 7 desktop">
    <div class="desktop-wallpaper" aria-hidden="true"></div>
  </section>

  <script src="script.js"></script>
</body>
</html>
